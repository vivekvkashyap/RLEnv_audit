[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlenv-audit"
version = "0.4.0"
description = "rlenv_audit, a skill-based auditing system for Prime Intellect `verifiers` RL environments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vivek", email = "vivekvkashyap10@gmail.com" }]
keywords = ["rl", "reinforcement-learning", "verifiers", "prime-intellect", "audit", "reward-hacking", "skills"]

dependencies = [
    # Pinned: old/fragile CUDA on the target box — do NOT bump (a newer verifiers
    # drags in torch/vLLM). The tool layer needs only the verifiers core.
    "verifiers==0.1.14",
    "click>=8.1",
    "rich>=13.0",
    "docker>=7.0",
    "openai>=1.0",
]

[project.optional-dependencies]
# vf-eval / vLLM-backed rollouts for the latency check on a GPU box.
gpu = ["vllm"]
dev = ["pytest>=7.0"]

[project.scripts]
rlenv-audit = "rlenv_audit.cli:main"
env-audit = "rlenv_audit.cli:main"

[project.urls]
Repository = "https://github.com/vivekvkashyap/RLEnv_audit"

[tool.hatch.build.targets.wheel]
packages = ["rlenv_audit"]

# Ship the skill files inside the wheel so `rlenv-audit install-skills` can
# copy them into ~/.claude/skills without a git checkout.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "rlenv_audit/skills"
